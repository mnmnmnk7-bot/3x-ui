name: Go CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - name: Verify installer shell syntax and fork URLs
        run: |
          bash -n install.sh
          bash -n x-ui.sh
          if grep -nE 'github.com/xeefei/3x-ui|raw.githubusercontent.com/xeefei/3x-ui|api.github.com/repos/xeefei/3x-ui' install.sh x-ui.sh; then
            echo "Old upstream installer URL found" >&2
            exit 1
          fi
      - name: Confirm toolchain
        run: go version
      - name: Run unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build all packages
        run: go build ./...
