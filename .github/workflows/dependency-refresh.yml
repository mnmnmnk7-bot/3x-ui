name: One-time dependency refresh (maintenance branch)

on:
  push:
    branches: [maintenance/dependency-refresh-2026-11]
    paths:
      - '.github/workflows/dependency-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'mnmnmnk7-bot/3x-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - name: Upgrade reported vulnerable Go dependencies and web/Xray modules
        run: |
          set -euo pipefail
          go get \
            github.com/gin-gonic/gin@v1.12.0 \
            github.com/gin-contrib/sessions@v1.1.3 \
            github.com/xtls/xray-core@v1.260327.1-0.20261104110144-858c44f410ed \
            github.com/andybalholm/brotli@v1.2.7 \
            github.com/klauspost/compress@v1.20.3 \
            golang.org/x/net@v0.62.0 \
            google.golang.org/grpc@v1.85.0 \
            golang.org/x/text@v0.43.0 \
            github.com/quic-go/quic-go@v0.65.0 \
            github.com/cloudflare/circl@v1.6.3 \
            github.com/refraction-networking/utls@v1.8.3-0.20260301010127-aa6edf4b11af
          go mod tidy
          git diff --stat go.mod go.sum
      - name: Test compatibility
        run: |
          go test ./...
          go vet ./...
          go build ./...
      - name: Re-scan security
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Commit tested module upgrades
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          if git diff --cached --quiet; then
            echo "No changes to dependencies"
            exit 0
          fi
          git commit -m "deps: update Gin Xray core and flagged vulnerable modules"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:maintenance/dependency-refresh-2026-11
