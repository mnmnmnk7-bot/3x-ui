name: Build and Release 3x-ui

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - '**/*.js'
      - '**/*.css'
      - '**/*.html'
      - '**/*.sh'
      - 'go.mod'
      - 'go.sum'
      - 'x-ui.service'
      - '.github/workflows/release.yml'

permissions:
  contents: read

env:
  XRAY_VERSION: v26.11.9

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [amd64, arm64, armv7, armv6, armv5, '386', s390x]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true
      - name: Install cross-compiler
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            amd64) exit 0 ;;
            arm64) package=gcc-aarch64-linux-gnu ;;
            armv7) package=gcc-arm-linux-gnueabihf ;;
            armv6|armv5) package=gcc-arm-linux-gnueabi ;;
            386) package=gcc-i686-linux-gnu ;;
            s390x) package=gcc-s390x-linux-gnu ;;
            *) exit 1 ;;
          esac
          sudo apt-get update
          sudo apt-get install -y "$package"
      - name: Compile and bundle panel + Xray
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          export CGO_ENABLED=1 GOOS=linux
          case "$PLATFORM" in
            amd64) export GOARCH=amd64 CC=gcc; xray_arch=64 ;;
            arm64) export GOARCH=arm64 CC=aarch64-linux-gnu-gcc; xray_arch=arm64-v8a ;;
            armv7) export GOARCH=arm GOARM=7 CC=arm-linux-gnueabihf-gcc; xray_arch=arm32-v7a ;;
            armv6) export GOARCH=arm GOARM=6 CC=arm-linux-gnueabi-gcc; xray_arch=arm32-v6 ;;
            armv5) export GOARCH=arm GOARM=5 CC=arm-linux-gnueabi-gcc; xray_arch=arm32-v5 ;;
            386) export GOARCH=386 CC=i686-linux-gnu-gcc; xray_arch=32 ;;
            s390x) export GOARCH=s390x CC=s390x-linux-gnu-gcc; xray_arch=s390x ;;
            *) echo "Unsupported platform: $PLATFORM" >&2; exit 1 ;;
          esac
          mkdir -p x-ui/bin
          go build -trimpath -ldflags '-w -s' -o x-ui/x-ui ./main.go
          cp x-ui.service x-ui.sh x-ui/
          xray_url="https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION/Xray-linux-$xray_arch.zip"
          curl -fL --retry 3 "$xray_url" -o xray.zip
          unzip -q -o xray.zip -d x-ui/bin
          rm -f xray.zip x-ui/bin/geoip.dat x-ui/bin/geosite.dat
          mv x-ui/bin/xray "x-ui/bin/xray-linux-$PLATFORM"

          fetch_data() {
            curl -fL --retry 3 --silent --show-error "$1" -o "x-ui/bin/$2"
          }
          fetch_data https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat geoip.dat
          fetch_data https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat geosite.dat
          fetch_data https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat geoip_IR.dat
          fetch_data https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat geosite_IR.dat
          fetch_data https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat geoip_RU.dat
          fetch_data https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat geosite_RU.dat

          tar -czf "x-ui-linux-$PLATFORM.tar.gz" x-ui
      - uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-${{ matrix.platform }}
          path: x-ui-linux-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Gather packages
        uses: actions/download-artifact@v4
        with:
          pattern: x-ui-linux-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 manifest
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Attach binary archives and checksums
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
